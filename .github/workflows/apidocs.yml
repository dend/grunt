name: Publish API Documentation

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    - name: Build
      working-directory: ./Den.Dev.Grunt/Den.Dev.Grunt
      run: dotnet build --configuration Release
    - name: Download mdoc
      run: Invoke-WebRequest https://github.com/mono/api-doc-tools/releases/download/mdoc-5.9.6/mdoc-5.9.6.zip -OutFile mdoc.zip
    - name: Download ECMA2YAML
      run: Invoke-WebRequest https://www.nuget.org/api/v2/package/Microsoft.DocAsCode.ECMA2Yaml/1.0.916 -OutFile ecma2yaml.zip
    - name: Extract mdoc
      run: Expand-Archive -Path mdoc.zip -DestinationPath _mdoc
    - name: Extract ECMA2YAML
      run: Expand-Archive -Path ecma2yaml.zip -DestinationPath _ecma2yaml
    - name: Run mdoc bootstrap
      working-directory: ./Den.Dev.Grunt/Den.Dev.Grunt/bin
      run: ${{ github.workspace }}\_mdoc\mdoc.exe fx-bootstrap Release
    - name: Checkout docs repo
      uses: actions/checkout@v4
      with:
        repository: 'dend/grunt-docs'
        path: '_docs'
        token: ${{ secrets.DOCS_PAT }}
    - name: Run import script
      working-directory: ./Den.Dev.Grunt/Den.Dev.Grunt/bin/Release
      run: ${{ github.workspace }}\_docs\scripts\mdoc-import.ps1
    - name: Run XML generation
      working-directory: ./Den.Dev.Grunt/Den.Dev.Grunt/bin/Release
      run: ${{ github.workspace }}\_mdoc\mdoc.exe update --debug --out _xml -fx (Resolve-Path frameworks.xml) --use-docid
    - name: Run YAML generation
      run: _ecma2yaml\tools\ecma2yaml.exe update -s ${{ github.workspace }}\Den.Dev.Grunt\Den.Dev.Grunt\bin\Release\_xml -o _ready_yaml
    - name: Clean old API files
      run: |
        if (Test-Path ${{ github.workspace }}\_docs\docs\dotnet\api\) {
          Remove-Item -recurse ${{ github.workspace }}\_docs\docs\dotnet\api\* -exclude *.md,.gitignore
        }
    - name: Copy new files
      run: Copy-Item -Path "_ready_yaml\*" -Destination "${{ github.workspace }}\_docs\docs\dotnet\api"  -Force -Recurse -Verbose
    - name: Commit and push all the documentation changes
      working-directory: _docs
      run: |
        git add -A -v
        git config --global user.name 'Den Delimarsky'
        git config --global user.email '1389609+dend@users.noreply.github.com'
        git commit -m "Docs update."
        git push origin main
