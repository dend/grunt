name: Publish npm Package

on:
  push:
    tags:
      - 'node-[0-9]+.[0-9]+.[0-9]+'
    branches:
      - master
    paths:
      - 'src/node/**'
  pull_request:
    paths:
      - 'src/node/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./src/node
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        registry-url: 'https://registry.npmjs.org'

    - name: Install dependencies
      run: npm ci

    - name: Type check
      run: npm run typecheck

    - name: Run tests
      run: npm test

    - name: Build
      run: npm run build

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/node-')
    defaults:
      run:
        working-directory: ./src/node
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        registry-url: 'https://registry.npmjs.org'

    - name: Install dependencies
      run: npm ci

    - name: Set version from tag
      run: |
        VERSION=${GITHUB_REF#refs/tags/node-}
        npm version $VERSION --no-git-tag-version

    - name: Build
      run: npm run build

    - name: Publish to npm
      run: npm publish --access public
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
