name: CI

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      # Composer and Zeta reference src/conch, which lives in another repo, so they are not built here.
      - run: |
          for p in Den.Dev.Grunt Den.Dev.Grunt.Auditor Den.Dev.Grunt.Librarian; do
            dotnet build "src/dotnet/Den.Dev.Grunt/$p/$p.csproj" --configuration Release
          done

  node:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/node/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
